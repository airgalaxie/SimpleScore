name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Read Java version from catalog
        id: java-version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          catalog = tomllib.loads(Path("gradle/libs.versions.toml").read_text())
          print(f"version={catalog['versions']['java']}")
          PYTHON

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle Wrapper
        run: ./gradlew adapterJars

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          generate_release_notes: true
          files: target/*.jar
        continue-on-error: false
