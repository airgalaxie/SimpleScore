name: Test

on:
  push:
    branches: [ "main" ]
    tags-ignore: [ "v*.*.*" ]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Read Java version from catalog
        id: java-version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          catalog = tomllib.loads(Path("gradle/libs.versions.toml").read_text())
          print(f"version={catalog['versions']['java']}")
          PYTHON

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test with Gradle Wrapper
        run: ./gradlew test adapterJars
