name: Docs

on:
  push:
    tags: [ "v*.*.*" ]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: documentation
  cancel-in-progress: false

jobs:
  dokka:
    name: Dokka Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Read Java version from catalog
        id: java-version
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          catalog = tomllib.loads(Path("gradle/libs.versions.toml").read_text())
          print(f"version={catalog['versions']['java']}")
          PYTHON

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.java-version.outputs.version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dokka Generate with Gradle Wrapper
        run: ./gradlew :dokkaGenerate

      - name: Upload Dokka Docs to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/build/dokka/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
